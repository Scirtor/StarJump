plugins { id 'com.android.application' }
android {
    namespace 'com.scirtor.starjump'
    compileSdk 35
    defaultConfig {
        applicationId 'com.scirtor.starjump'
        minSdk 26
        targetSdk 35
        versionCode 10001
        versionName '1.0.1-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'wasm', 'data', 'whl', 'gz' }
    lint { abortOnError true }
}
